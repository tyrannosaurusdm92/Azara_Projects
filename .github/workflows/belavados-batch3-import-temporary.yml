name: Temporary Belavadós TTRPG batch 3 asset import
on:
  push:
    branches: [main]
    paths:
      - "TTRPG/.belavados_batch3/READY"
permissions:
  contents: write
concurrency:
  group: belavados-batch3-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify ZIP and restore exact original assets
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f TTRPG/.belavados_batch3/READY ]; then
            echo "No pending batch 3 import; already completed."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, json, shutil
          root=Path("TTRPG/.belavados_batch3")
          meta=json.loads((root/"READY").read_text())
          parts=sorted(root.glob("piece-*.bin"))
          names=[f"piece-{i:03d}.bin" for i in range(meta["piece_count"])]
          if [p.name for p in parts] != names:
              raise SystemExit("Batch 3 transfer piece list is incomplete")
          archive=Path("/tmp/belavados-batch3-remaining.zip")
          h=hashlib.sha256()
          with archive.open("wb") as output:
              for part in parts:
                  with part.open("rb") as src:
                      while True:
                          chunk=src.read(1024*1024)
                          if not chunk: break
                          h.update(chunk)
                          output.write(chunk)
          if h.hexdigest() != meta["zip_sha256"]:
              raise SystemExit("Batch 3 ZIP checksum mismatch")
          expected=meta["expected"]
          with zipfile.ZipFile(archive) as z:
              members=[m for m in z.infolist() if not m.is_dir()]
              if len(members)!=9 or len(set(m.filename for m in members))!=9 or set(m.filename for m in members)!=set(expected):
                  raise SystemExit("Unexpected file list: refusing to extract")
              for member in members:
                  path=Path(member.filename)
                  if path.is_absolute() or ".." in path.parts or not member.filename.startswith("assets/"):
                      raise SystemExit("Unsafe asset path")
                  if ((member.external_attr >> 16) & 0o170000)==0o120000:
                      raise SystemExit("Symlink not permitted")
                  content=z.read(member)
                  gitsha=hashlib.sha1(b"blob "+str(len(content)).encode()+b"\0"+content).hexdigest()
                  if gitsha!=expected[member.filename]:
                      raise SystemExit(f"Git SHA mismatch: {member.filename}")
                  dest=Path("TTRPG")/path
                  if dest.exists() and dest.read_bytes()!=content:
                      raise SystemExit(f"Existing asset differs; not overwriting: {dest}")
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(content)
          print("Validated exact original 9 missing assets")
          PY
          rm -rf TTRPG/.belavados_batch3
      - name: Commit and push verified assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- TTRPG/assets TTRPG/.belavados_batch3
          if ! git diff --cached --quiet; then
            git commit -m "TTRPG: complete original Belavadós V9 assets batch 3"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
